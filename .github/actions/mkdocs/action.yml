# SPDX-License-Identifier: Apache-2.0

name: MkDocs
description: Build SKILL.md documentation with Material theme and Markdown compatibility hooks.
author: "sentenz"

inputs:
  python-version:
    description: Python version to use.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Dependencies
      shell: bash
      run: |
        python -m pip install --quiet -r requirements-docs.txt

    - name: Test MkDocs Hooks
      shell: bash
      run: python -m unittest discover -s tests/mkdocs -v

    - name: Build Site
      shell: bash
      run: python -m mkdocs build --strict
