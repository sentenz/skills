version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 10

    # Group updates by semantic version type
    groups:
      github-actions-patch:
        update-types:
          - patch
      github-actions-minor:
        update-types:
          - minor
      github-actions-major:
        update-types:
          - major
