# SPDX-License-Identifier: Apache-2.0

name: Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * 0"

jobs:
  renovate:
    name: Renovate Action
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Renovate
        uses: sentenz/actions/renovate@d3b0a0d59ac008f6918c5d8304acab2c9d1abbf2 # 1.4.3
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
