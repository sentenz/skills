# SPDX-License-Identifier: Apache-2.0

name: Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * 0"

jobs:
  renovate:
    name: Renovate Action
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Renovate
        uses: sentenz/actions/renovate@1f71880fdb530642b617b45d42caa289c9d6d042 # 1.5.1
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
