# SPDX-License-Identifier: Apache-2.0

name: Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * 0"

jobs:
  renovate:
    name: Renovate Action
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Renovate
        uses: sentenz/actions/renovate@3fb44ff384819e1eb88fc1c661ec3d04b6d930c0 # 1.1.7
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
