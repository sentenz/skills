# SPDX-License-Identifier: Apache-2.0

name: Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * 0"

jobs:
  renovate:
    name: Renovate Action
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Renovate
        uses: sentenz/actions/renovate@bceed480720a7bc304e974cd655ebe42ac41d5e2 # 1.1.9
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
