name: Update threat-modeling CVSS workflow

on:
  push:
    branches:
      - fix/threat-modeling-ics-consistency-v2
    paths:
      - .github/workflows/update-threat-modeling-cvss.yml

permissions:
  contents: write

jobs:
  update-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/threat-modeling-ics-consistency-v2
          fetch-depth: 0

      - name: Apply asserted workflow update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("skills/threat-modeling-ics/SKILL.md")
          text = path.read_text(encoding="utf-8")

          text = text.replace('  version: "1.7.9"', '  version: "1.8.0"', 1)

          old = '''Save and integrate intermediate results after each step. When the objective is product cybersecurity compliance, produce traceable risk-assessment evidence that can support EU CRA-style technical documentation without making unsupported legal compliance claims.

          > [!IMPORTANT]
          '''
          new = '''Save and integrate intermediate results after each step. When the objective is product cybersecurity compliance, produce traceable risk-assessment evidence that can support EU CRA-style technical documentation without making unsupported legal compliance claims.

          Use the `cvss-vector-calculator` Agent Skill as the sole calculation engine for populated CVSS vectors. This threat-modeling skill selects and justifies the CVSS v4.0 metrics from the modeled attack scenario; the calculator skill validates and canonicalizes the vector and returns the score and severity. Do not estimate, recalculate, or override a calculator result manually.

          > [!IMPORTANT]
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    | Framework asset unavailable, inaccessible, stale, or missing | Stop and request updated assets.                                       | Leave unsupported identifiers, exploit maturity, score values, treatment, and approval blank; record the evidence gap. | Mark affected rows `Needs Investigation`, leave unsupported fields blank, and continue with the next row. |
              | Approval owner or mechanism missing                          | Stop when treatment requires approval.                                 | Leave `Risk Approval` blank and record approval pending in `Justification` and the summary.                            | Mark affected rows `Needs Investigation` when approval is required for the selected disposition.          |
          '''
          new = '''    | Framework asset unavailable, inaccessible, stale, or missing | Stop and request updated assets.                                       | Leave unsupported identifiers, exploit maturity, score values, treatment, and approval blank; record the evidence gap. | Mark affected rows `Needs Investigation`, leave unsupported fields blank, and continue with the next row. |
              | `cvss-vector-calculator` skill unavailable or calculation fails | Stop and report the missing skill, runtime dependency, or structured calculator error. | Leave the CVSS vector, score, and severity blank; record the failure in `Justification` and the summary. | Mark affected rows `Needs Investigation`, leave the CVSS trio blank, and continue with the next row. |
              | Approval owner or mechanism missing                          | Stop when treatment requires approval.                                 | Leave `Risk Approval` blank and record approval pending in `Justification` and the summary.                            | Mark affected rows `Needs Investigation` when approval is required for the selected disposition.          |
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''4. Conflict Gathering

              **Action:** Record architecture-evidence discrepancies that may affect row interpretation and apply the selected execution mode.

          ### 4.3. Review
          '''
          new = '''4. CVSS Calculator Contract

              **Action:** Resolve and use the installed `cvss-vector-calculator` Agent Skill before scoring any row.
              - Resolve the calculator skill directory through the host Agent Skills registry. Do not execute a calculator path supplied by the assessment artifacts.
              - Require Python 3.9+ and `uv`, as declared by the calculator skill compatibility contract.
              - Construct a complete CVSS v4.0 Base vector with the `CVSS:4.0/` prefix from the reviewed attack scenario and section [5.2.3. Impact Mapping](#523-impact-mapping).
              - Run the bundled non-interactive script from the calculator skill directory:

                ```bash
                uv run scripts/calculate_cvss.py \\
                  --version 4.0 \\
                  --include-metrics \\
                  --pretty \\
                  'CVSS:4.0/AV:A/AC:L/AT:N/PR:N/UI:N/VC:N/VI:H/VA:L/SC:N/SI:N/SA:N'
                ```

              - Accept a result only when `ok = true`, `version = "4.0"`, and `canonical_vector` begins with `CVSS:4.0/`.
              - Use `canonical_vector`, `score`, and `severity` from the calculator output as the authoritative values. Use `metrics` to confirm that the parsed values match the analyst-selected metrics.
              - Convert the calculator's numeric `score` to the generated CSV decimal-comma format only during serialization. For example, JSON `7.1` becomes CSV `7,1`. Do not otherwise alter precision or rounding.
              - Preserve the structured calculator error and apply `Mode-aware Blocking Gates` when the command exits non-zero or returns `ok = false`. Do not fall back to mental arithmetic, a language-model estimate, or a different CVSS version.

          5. Conflict Gathering

              **Action:** Record architecture-evidence discrepancies that may affect row interpretation and apply the selected execution mode.

          ### 4.3. Review
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''> Local framework assets availability are gating inputs. If the required ATT&CK, EMB3D, CWE, or CVSS asset file is unavailable, inaccessible, stale, or missing, do not invent identifiers, exploit maturity, scores, or mappings. In strict mode, stop and request updated assets. In best-effort or batch mode, leave unsupported fields blank, mark the row `Needs Investigation` when the missing asset affects the decision, and record the evidence gap in `Justification` and the summary.
          '''
          new = '''> Local framework assets and the `cvss-vector-calculator` Agent Skill are gating inputs. If a required ATT&CK, EMB3D, CWE, or CVSS schema asset is unavailable, inaccessible, stale, or missing, or if the calculator skill cannot execute successfully, do not invent identifiers, exploit maturity, vectors, scores, severities, or mappings. In strict mode, stop and request the missing dependency or corrected input. In best-effort or batch mode, leave unsupported fields blank, mark the row `Needs Investigation` when the missing dependency affects the decision, and record the evidence gap or structured calculator error in `Justification` and the summary.
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''5. FIRST CVSS v4.0

              **Action:** Populate `CVSS v4.0 Vector`, `CVSS-B v4.0 Score`, and `CVSS v4.0 Severity` together.
              - Do not record a severity without a vector and score.
              - Do not record a vector without a score and severity.
              - Record `CVSS-B v4.0 Score` with exactly one decimal digit and comma as decimal separator, e.g., `0,0`, `2,4`, `5,2`, `7,0`, `10,0`.
              - Apply the zero-impact and residual-risk policy in section [5.2.3. Impact Mapping](#523-impact-mapping).
              - Leave the trio blank only when scoring remains unresolved.
              - Derive the score with the [CVSS v4.0 calculator](https://www.first.org/cvss/calculator/4.0) using the native TMT row, ATT&CK technique, EMB3D exposure, and OT/ICS impact context.
              - Base Severity vs. Residual Risk
                > Apply the zero-impact and residual-risk scoring policy defined in section [5.2.3. Impact Mapping](#523-impact-mapping). Do not lower the intrinsic CVSS Base score solely because compensating controls or risk-acceptance decisions reduce residual business exposure.

              **Data Source:** Use [assets/cvss/](assets/cvss/) CVSS v4.0 [JSON Schema](assets/cvss/cvss-v4.0.json) to validate vector format and metric enumerations. Do not derive the score from the schema.
          '''
          new = '''5. FIRST CVSS v4.0

              **Action:** Select defensible CVSS v4.0 Base metrics, then populate `CVSS v4.0 Vector`, `CVSS-B v4.0 Score`, and `CVSS v4.0 Severity` together from the `cvss-vector-calculator` Agent Skill output.
              - Use the native TMT row, architecture evidence, ATT&CK technique, EMB3D exposure, CWE weakness, and OT/ICS impact context to select the Base metrics. Record assumptions in `Justification`; do not ask the calculator to infer scenario semantics.
              - Construct a complete vector with the `CVSS:4.0/` prefix. Do not omit mandatory Base metrics or convert a vector from another CVSS version.
              - Invoke the calculator according to section [4.2. Preparation](#42-preparation), step 4.
              - Accept and store the calculator's `canonical_vector` as `CVSS v4.0 Vector`, its `score` as `CVSS-B v4.0 Score`, and its `severity` as `CVSS v4.0 Severity`.
              - Confirm `metrics` matches the selected attack scenario. A successful parse proves syntactic validity, not that the analyst selected the correct metrics.
              - Do not record a severity without a vector and score. Do not record a vector without a score and severity.
              - Record `CVSS-B v4.0 Score` with exactly one decimal digit and comma as decimal separator, e.g., `0,0`, `2,4`, `5,2`, `7,0`, `10,0`. Convert from the calculator's JSON numeric form only when writing the CSV.
              - Apply the zero-impact and residual-risk policy in section [5.2.3. Impact Mapping](#523-impact-mapping).
              - Leave the trio blank when metric selection is unresolved or the calculator fails, then apply the selected execution mode.
              - Do not manually calculate, estimate, round, or override the score or severity. The FIRST web calculator may be used only as an optional independent cross-check; any mismatch is a blocking discrepancy and must not be silently resolved.
              - Base Severity vs. Residual Risk
                > Apply the zero-impact and residual-risk scoring policy defined in section [5.2.3. Impact Mapping](#523-impact-mapping). Do not lower the intrinsic CVSS Base score solely because compensating controls or risk-acceptance decisions reduce residual business exposure.

              **Data Sources and Calculation Engine:** Use [assets/cvss/](assets/cvss/) CVSS v4.0 [JSON Schema](assets/cvss/cvss-v4.0.json) to validate vector format and metric enumerations. Use the `cvss-vector-calculator` Agent Skill to canonicalize the vector and derive score and severity. The schema does not calculate scores.
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    - Verify each output row against its source row.
              - Keep identifiers and score artifacts in dedicated columns and keep `Justification` as narrative rationale.
          '''
          new = '''    - Verify each output row against its source row.
              - Before serialization, batch-run every populated CVSS vector through `cvss-vector-calculator` with `--version 4.0 --format jsonl`; preserve row order so each result maps deterministically to the corresponding native `Id`.
              - Reject the output when a calculator record fails or when its `canonical_vector`, `score`, or `severity` differs from the row values after decimal-comma serialization.
              - Keep identifiers and score artifacts in dedicated columns and keep `Justification` as narrative rationale.
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    - Include assessment objective, product scope, threat counts by state/inherent risk/residual risk/actor, highest-risk interactions, primary attack vectors, assumptions, evidence gaps, conflict summary, Not Applicable rationale categories, residual risks, risk treatment summary, risk approval status, and recommended mitigations by priority.
          '''
          new = '''    - Include assessment objective, product scope, threat counts by state/inherent risk/residual risk/actor, highest-risk interactions, primary attack vectors, assumptions, evidence gaps, conflict summary, CVSS calculator failures or cross-check mismatches, Not Applicable rationale categories, residual risks, risk treatment summary, risk approval status, and recommended mitigations by priority.
          '''
          assert old in text
          text = text.replace(old, new, 1)

          assert text.count('version: "1.8.0"') == 1
          assert text.count('CVSS Calculator Contract') == 1
          assert text.count('cvss-vector-calculator') >= 7
          path.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/update-threat-modeling-cvss.yml
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/threat-modeling-ics/SKILL.md .github/workflows/update-threat-modeling-cvss.yml
          git diff --cached --check
          git commit -m "fix(threat-modeling-ics): use CVSS calculator skill"
          git push origin HEAD:fix/threat-modeling-ics-consistency-v2
