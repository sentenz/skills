apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "identity.v1.name" . }}
  labels: {{- include "web.v1.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.configReader }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "identity.v1.name" . }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ include "identity.v1.name" . | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "identity.v1.name" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "identity.v1.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "identity.v1.name" . }}
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
