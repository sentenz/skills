{{- if ne .Values.workload "Job" }}
{{- $checks := list "test" }}
{{- if .Values.smokeHook }}{{ $checks = append $checks "post" }}{{ end }}
{{- range $checks }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "identity.v1.name" $ }}-{{ . }}
  annotations:
    helm.sh/hook: {{ ternary "test" "post-install,post-upgrade" (eq . "test") | quote }}
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name | quote }}
        app.kubernetes.io/component: client
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {{- include "web.v1.podSecurity" $ | nindent 8 }}
      containers:
        - name: probe
          image: {{ $.Values.image | quote }}
          command: ["wget", "-T", "5", "-O", "/dev/null", {{ printf "http://%s/index.html" (include "identity.v1.name" $) | quote }}]
          securityContext: {{- include "web.v1.containerSecurity" $ | nindent 12 }}
          resources: {{- toYaml $.Values.resources | nindent 12 }}
{{- end }}
{{- end }}
