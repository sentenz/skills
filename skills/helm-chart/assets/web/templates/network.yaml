{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "identity.v1.name" . }}
spec:
  podSelector:
    matchLabels: {{- include "identity.v1.selector" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  egress: []
  {{- if eq .Values.workload "Job" }}
  ingress: []
  {{- else }}
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
              app.kubernetes.io/component: client
        {{- with .Values.networkPolicy.namespaceLabels }}
        - namespaceSelector:
            matchLabels: {{- toYaml . | nindent 14 }}
        {{- end }}
      ports: [{protocol: TCP, port: 8080}]
  {{- end }}
{{- end }}
